site_name: Interoperability Data Model
site_description: >-
  Reference documentation for the Interoperability Data Model (IDM): a common, machine
  readable model for microgrid electrical components, generated from the dcide-app validators.
repo_url: https://github.com/Direct-Energy-Partners/interoperability-data-model
repo_name: interoperability-data-model
docs_dir: docs
site_url: https://direct-energy-partners.github.io/interoperability-data-model/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - content.code.copy
    - search.suggest
    - search.highlight
    - toc.follow

plugins:
  - search

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.inlinehilite

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  nav:
    not_found: warn
  links:
    not_found: warn
    anchors: warn

nav:
  - Home: README.md
  - Data model:
      - Common attributes: common.md
      - Battery: battery.md
      - Cable: cable.md
      - Capacitor: capacitor.md
      - Circuit Breaker: breaker.md
      - Combiner Box: combinerBox.md
      - Contactor: contactor.md
      - Converter: converter.md
      - Current Transducer: currentTransducer.md
      - Diode: diode.md
      - Disconnect: disconnect.md
      - EV Charger: charger.md
      - Fuel Cell: fuelCell.md
      - Fuse: fuse.md
      - Generator: generator.md
      - Grounding: grounding.md
      - HVAC: hvac.md
      - Hydro: hydro.md
      - Light: light.md
      - Load: load.md
      - Meter: meter.md
      - Motor: motor.md
      - Panel Switchboard: panel.md
      - Power Distribution Unit: powerDistributionUnit.md
      - Precharge: precharge.md
      - Rapid Shutdown Device: rapidShutdownDevice.md
      - Solar Panel: solar.md
      - Transfer Switch: transferSwitch.md
      - Transformer: transformer.md
      - Utility: utility.md
      - Voltage Transducer: voltageTransducer.md
      - Wind: wind.md
  - Schema reference:
      - Overview: reference/index.md
      - Battery: reference/battery.md
      - Cable: reference/cable.md
      - Capacitor: reference/capacitor.md
