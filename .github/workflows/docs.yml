name: Docs

# Builds the Fumadocs site as a Next.js static export and deploys it to GitHub
# Pages using the official Pages-from-Actions flow (configure-pages,
# upload-pages-artifact, deploy-pages).
#
# After this branch is merged, change the trigger branch below from
# idm-docs-website to main so the live site tracks main.

on:
  push:
    branches:
      - idm-docs-website
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Generate Fumadocs content from schemas and prose
        run: python scripts/gen_docs.py

      - name: Install dependencies
        working-directory: website
        run: npm ci

      - name: Build static site
        working-directory: website
        run: npm run build

      - name: Configure Pages
        # Requires Pages to be enabled with Source = GitHub Actions in the repo
        # settings (Settings > Pages). This step fails until that toggle is set;
        # every step before it (content generation and the static build) passes.
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: website/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
